# nginx for the browser version: static files only, strict security headers, unprivileged.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
        application/zip whl;
        text/plain py md toml;
    }
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/javascript application/javascript application/json application/wasm text/css text/plain;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # The browser may load from, and connect to, this server only (same policy as index.html).
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob: data:; worker-src 'self' blob:; connect-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; frame-src 'self' blob: data:; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        location / {
            # Only reading files; nothing can be uploaded to this server.
            limit_except GET { deny all; }
            try_files $uri =404;
        }
        # Server configuration files for other web servers aren't served.
        location ~ ^/(\.htaccess|web\.config|nginx\.conf\.example)$ { return 404; }
    }
}
