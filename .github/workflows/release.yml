# When a version is tagged (for example v1.1.0): attach the offline browser package to the
# GitHub release, and publish both hosting images to GitHub Container Registry.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # attach files to the release
  packages: write   # publish images to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the offline browser package
        run: |
          python tools/build_offline.py --out "dist/bank-statement-analyzer-${GITHUB_REF_NAME}"
          cd dist && zip -qr "bank-statement-analyzer-offline-${GITHUB_REF_NAME}.zip" "bank-statement-analyzer-${GITHUB_REF_NAME}"
          sha256sum "bank-statement-analyzer-offline-${GITHUB_REF_NAME}.zip" > "bank-statement-analyzer-offline-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/bank-statement-analyzer-offline-*.zip
            dist/bank-statement-analyzer-offline-*.zip.sha256
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1  # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the browser image (option 1)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: deploy/browser/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bank-statement-analyzer-browser:${{ github.ref_name }}
      - name: Publish the server image (option 2)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          file: deploy/server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/bank-statement-analyzer-server:${{ github.ref_name }}
