# Keep the app private when run locally: no usage statistics, and only this computer can open it.
[browser]
gatherUsageStats = false

[server]
address = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#14284B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#1F2937"
font = "sans serif"
