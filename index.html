<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank Statement Analyzer</title>
    <!--
      In-browser version of the app. stlite runs Python and Streamlit inside the
      browser (WebAssembly), so uploaded statements are processed on the viewer's
      own computer and are never sent to a server. Host this folder on any static
      host (e.g. GitHub Pages) or open it with `python -m http.server`.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.10.0/build/stlite.css" />
    <style>
      body { margin: 0; background: #ffffff; }
      #loading { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 36rem; margin: 5rem auto; padding: 0 1rem; color: #374151; }
      #loading .org { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #8a6d12; margin: 0; }
      #loading h1 { color: #14284b; font-size: 1.7rem; margin: 0.2rem 0 0.6rem; }
      #loading .bar { height: 4px; background: #e3e7ee; border-radius: 2px; overflow: hidden; margin: 1.2rem 0; }
      #loading .bar::after { content: ""; display: block; height: 100%; width: 35%; background: #c9a227; animation: slide 1.4s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading">
        <p class="org">Justice for Fraud Victims Project</p>
        <h1>Bank Statement Analyzer</h1>
        <div class="bar"></div>
        <p>Loading… the first visit downloads about 40 MB and can take a minute. After that, everything runs
        inside this browser tab: statements you upload never leave your computer.</p>
      </div>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.10.0/build/stlite.js";

      const sourceFiles = [
        "app.py",
        "auto_parser.py",
        "financial_statements.py",
        "statement_parser.py",
        "template_manager.py",
        "workpaper_export.py",
        "web_app.py",
        "Sample-Statement.pdf",
        "statement_sample1.pdf",
      ];
      // Included only if present, so adding a logo needs no change here.
      const optionalFiles = ["assets/logo.svg", "assets/logo.png", "assets/logo.jpg"];
      for (const name of optionalFiles) {
        try {
          if ((await fetch(`./${name}`, { method: "HEAD" })).ok) sourceFiles.push(name);
        } catch {}
      }

      mount(
        {
          entrypoint: "web_app.py",
          requirements: ["pandas", "openpyxl", "pdfminer.six==20260107"],
          files: Object.fromEntries(sourceFiles.map((name) => [name, { url: `./${name}` }])),
          // Saved templates live in browser storage so they survive a reload.
          idbfsMountpoints: ["/home/pyodide/saved"],
          env: { STATEMENT_TEMPLATES_PATH: "/home/pyodide/saved/statement_templates.json" },
          // Same look as .streamlit/config.toml, which the browser version doesn't read.
          streamlitConfig: {
            "client.toolbarMode": "minimal",
            "theme.base": "light",
            "theme.primaryColor": "#14284B",
            "theme.backgroundColor": "#FFFFFF",
            "theme.secondaryBackgroundColor": "#F4F6FA",
            "theme.textColor": "#1F2937",
            "theme.font": "sans serif",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
