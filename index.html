<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank Statement Analyzer</title>
    <!--
      In-browser version of the app. stlite runs Python and Streamlit inside the
      browser (WebAssembly), so uploaded statements are processed on the viewer's
      own computer and are never sent to a server. Host this folder on any static
      host (e.g. GitHub Pages) or open it with `python -m http.server`.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.10.0/build/stlite.css" />
    <style>
      body { margin: 0; background: #ffffff; }
      #loading { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 36rem; margin: 5rem auto; padding: 0 1rem; color: #374151; }
      #loading .org { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #246094; margin: 0; }
      #loading h1 { color: #1D2844; font-size: 1.7rem; margin: 0.2rem 0 0.6rem; }
      #loading .bar { height: 4px; background: #e3e7ee; border-radius: 2px; overflow: hidden; margin: 1.2rem 0; }
      #loading .bar::after { content: ""; display: block; height: 100%; width: 35%; background: #246094; animation: slide 1.4s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading">
        <img src="assets/logo.png" alt="Justice for Fraud Victims Project" style="height:64px" onerror="this.remove()">
        <p class="org">Justice for Fraud Victims Project</p>
        <h1>Bank Statement Analyzer</h1>
        <div class="bar"></div>
        <p>Loading… the first visit downloads about 40 MB and can take a minute. After that, everything runs
        inside this browser tab: statements you upload never leave your computer.</p>
      </div>
    </div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.10.0/build/stlite.js";

      const sourceFiles = [
        "app.py",
        "authenticity.py",
        "auto_parser.py",
        "bank_directory.py",
        "dashboard.py",
        "financial_statements.py",
        "fraud_rules.py",
        "ocr.py",
        "payees.py",
        "projects.py",
        "reconciliation.py",
        "pdf_text.py",
        "statement_parser.py",
        "template_manager.py",
        "version.py",
        "workpaper_export.py",
        "web_app.py",
        "assets/fonts/inter-latin-wght-normal.woff2",
        "assets/fonts/jost-latin-wght-normal.woff2",
        "assets/fonts/cormorant-garamond-latin-wght-italic.woff2",
        "demo/1_checking_2025-03.pdf",
        "demo/2_checking_2025-04.pdf",
        "demo/3_checking_2025-05.pdf",
        "demo/4_credit_card_2025-05.pdf",
        "demo/5_checking_2025-04_family_copy.pdf",
      ];
      // Included only if present, so adding a logo needs no change here.
      // Optional files, included only if present (a logo; files for "Download the app"; GitHub Pages
      // serves the dot-folders only because of .nojekyll).
      const optionalFiles = [
        "assets/logo.svg", "assets/logo.png", "assets/logo.jpg",
        "LICENSE", "NOTICE", "requirements.txt", "requirements-lock.txt", "README.md", "SECURITY.md", "index.html", ".gitignore", ".nojekyll", "start.bat", "start.sh",
        ".streamlit/config.toml", ".vscode/launch.json", ".vscode/tasks.json", ".vscode/extensions.json",
        "docs/Bank_Statement_Analyzer_User_Guide.pdf", "docs/Bank_Statement_Analyzer_Implementation_Guide.pdf",
        "demo/ANSWER_KEY.md", "demo/make_demo_case.py", "demo/6_checking_2025-05_scanned_redacted.pdf",
      ];
      for (const name of optionalFiles) {
        try {
          if ((await fetch(`./${name}`, { method: "HEAD" })).ok) sourceFiles.push(name);
        } catch {}
      }

      mount(
        {
          entrypoint: "web_app.py",
          requirements: ["pandas", "openpyxl", "pdfminer.six==20260107", "plotly"],
          files: Object.fromEntries(sourceFiles.map((name) => [name, { url: `./${name}` }])),
          // Saved banks and projects live in browser storage so they survive a reload.
          idbfsMountpoints: ["/home/pyodide/saved"],
          env: {
            STATEMENT_TEMPLATES_PATH: "/home/pyodide/saved/statement_templates.json",
            STATEMENT_PROJECTS_PATH: "/home/pyodide/saved/projects",
          },
          // Same look as .streamlit/config.toml, which the browser version doesn't read.
          streamlitConfig: {
            "browser.gatherUsageStats": false,
            "client.toolbarMode": "minimal",
            "theme.base": "light",
            "theme.primaryColor": "#1D2844",
            "theme.backgroundColor": "#FFFFFF",
            "theme.secondaryBackgroundColor": "#F4F6FA",
            "theme.textColor": "#1F2937",
            "theme.font": "sans serif",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
